<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Image Slider</title>
</head>
<body>


    <div class="slider">
        <div class="slider-track">
             <div class="slide"><img src="Image/wolv.jpg" alt="Image 1"></div>
             <div class="slide"><img src="Image/spider.jpg" alt="Image 2"></div>
             <div class="slide"><img src="Image/spider2.jpg" alt="Image 3"></div>
             <div class="slide"><img src="Image/spvn.jpg" alt="Image 4"></div>
             <div class="slide"><img src="Image/venom.jpg" alt="Image 5"></div>
        </div>
        <button class="slider-btn prev">&#10094;</button>
        <button class="slider-btn next">&#10095;</button>

        <div class="slider-dots"></div>


    </div>
</body>
</html>
